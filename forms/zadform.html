<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <form action="" method="get">
    <label for="roll">Roll no. :</label>
    <input type="text" id="roll"  size="51"/> <br /> <br>

    <label for="name">Student name :</label>
    <input type="text" id="name" placeholder="First Name">
    <label for="">-</label>
    <input type="text" id=" name" placeholder="Last Name"> <br> <br>

    <label for="fname">Father's name :</label>
    <input type="text" name="fname" id="fname" size="45"> <br> <br>

    <label for="date">Date of birth :</label>
    <input type="date" name="date" id="date">
    <label for=""> <var>(DD-MM-YYYY)</var></label> <br> <br>

    <label for="tel">Mobile no. :</label>
    <input type="tel" name="tel" id="tel" maxlength="3" size="1">
    <label for="">-</label>
    <input type="tel" name="tel" id="tel" size="41"> <br> <br>

    <label for="mail">Email id :</label>
    <input type="email" name="mail" id="mail" size="50"> <br> <br>

    <label for="pass">Password :</label>
    <input type="password" name="pass" id="pass" size="50"> <br> <br>

    <label for="">Gender :</label>
    <input type="radio" name="gen" id="male">
    <label for="male">Male</label>
    <input type="radio" name="gen" id="female">
    <label for="female">Female</label> <br> <br>
    
    <label for="">Deparment :</label>
    <input type="checkbox" name="1" id="CSE">
    <label for="">CSE</label>
    <input type="checkbox" name="2" id="IT">
    <label for="">IT</label>
    <input type="checkbox" name="3" id="ECE">
    <label for="">ECE</label>
    <input type="checkbox" name="4" id="Civil">
    <label for="">Civil</label>
    <input type="checkbox" name="5" id="Mech">
    <label for="">Mech</label> <br> <br>
    
    <label for="">Course :</label>
    <select name="select" id="select">
      <option value="s">------------------------ Select Current Course's --------------------------- </option>
    </select>





    </form>
  
</html>
